[project]
name = "garmin-mcp"
version = "0.1.0"
description = "Single-user MCP server over one Garmin Connect account"
requires-python = ">=3.12"
dependencies = [
    # Pinned exactly: FastMCP was removed in mcp 2.x and the entry class renamed,
    # so a minor drift here is not a cosmetic change.
    "mcp==2.1.1",
    # Floor-and-ceiling, never '==' (docs/SCOPE.md §2). The [workout] extra is
    # required: without it the workout builder models are silently absent.
    "garminconnect[workout]>=0.3.11,<0.4",
]

[project.optional-dependencies]
# Floor at 9.0.3: PYSEC-2026-1845 (predictable /tmp/pytest-of-{user} paths,
# local DoS or privilege escalation) affects every release through 9.0.2. It is
# a dev-only dependency and never ships -- requirements.lock is runtime-only --
# but pip-audit gates CI, and a standing advisory teaches people to skim it.
# Verified: the suite passes unchanged on 9.1.1.
dev = ["pytest>=9.0.3,<10"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["garmin_mcp*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
