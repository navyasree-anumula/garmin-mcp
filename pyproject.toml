[project]
name = "garmin-mcp"
version = "0.1.0"
description = "Single-user MCP server over one Garmin Connect account"
requires-python = ">=3.12"
dependencies = [
    # Pinned exactly: FastMCP was removed in mcp 2.x and the entry class renamed,
    # so a minor drift here is not a cosmetic change.
    "mcp==2.1.1",
    # Floor-and-ceiling, never '==' (docs/SCOPE.md §2). The [workout] extra is
    # required: without it the workout builder models are silently absent.
    "garminconnect[workout]>=0.3.11,<0.4",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["garmin_mcp*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
