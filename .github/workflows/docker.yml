name: Docker

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # garminconnect requires >=3.12, which is what sets this floor.
      - name: Install
        run: pip install -e ".[dev]"

      - name: Test
        run: pytest -q

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # docs/SCOPE.md §8. curl_cffi is a binary wheel whose stated purpose is TLS
      # impersonation, so the lockfile is audited rather than trusted. Audits the
      # lock, not the resolved env, because the lock is exactly what ships.
      - name: Audit locked dependencies
        run: |
          pip install pip-audit
          pip-audit -r requirements.lock --strict

  build-and-push:
    name: Build and publish
    # An image built from code whose tests fail is worse than no image, and one
    # with a known-vulnerable pinned wheel is worse still.
    needs: [test, audit]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      # arm64 is emulated. The Dockerfile compiles nothing -- curl_cffi ships
      # aarch64 wheels -- so this stays cheap, and it means the image runs
      # natively on an Apple Silicon laptop instead of under Rosetta.
      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      # Skipped for pull requests on purpose: a PR proves the image builds
      # without ever being able to publish one.
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=sha,format=short

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          build-args: |
            BUILD_REF=${{ github.sha }}
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
